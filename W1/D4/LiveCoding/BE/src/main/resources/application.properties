spring.application.name=demo

# ============================================================
# DATASOURCE - istanza PostgreSQL locale
# I default valgono per lo sviluppo locale; si possono sovrascrivere
# con le variabili d'ambiente DB_URL / DB_USERNAME / DB_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LiveCoding1009}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ============================================================
# CORS - origine del frontend Vite
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# JWT
# In produzione la chiave va passata dall'esterno (env JWT_SECRET),
# non lasciata come default nel file di configurazione.
# ============================================================
app.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-livecoding-1009-almeno-32-byte-per-hmac-sha256}
app.jwt.durata-minuti=${JWT_DURATA_MINUTI:120}
