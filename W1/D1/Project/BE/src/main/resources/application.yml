spring:
  application:
    name: w1d1-segnalazioni

  # I segreti stanno in BE/secrets.properties (fuori dal versionamento).
  config:
    import: optional:file:./secrets.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/W1D1Project_Segnalazioni}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      # update: lo schema lo crea e aggiorna Hibernate dalle @Entity.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Client HTTP dichiarativo: gruppo "geocoding" registrato in GeocodingClientConfig.
  # Geocoding API v4: host geocode.googleapis.com, NON maps.googleapis.com.
  # La vecchia /maps/api/geocode/json risponde REQUEST_DENIED ("You must enable
  # Billing") sui progetti in cui e' abilitata soltanto la v4.
  http:
    serviceclient:
      geocoding:
        base-url: ${GEOCODING_BASE_URL:https://geocode.googleapis.com}
        connect-timeout: 3s
        read-timeout: 5s

app:
  geocoding:
    cache:
      # Cache simulata: le geocodifiche stanno nella tabella geocoding_cache e
      # valgono 30 giorni. Oltre il TTL la riga viene richiesta di nuovo alle API
      # e riscritta in place: un indirizzo che cambia non resta sbagliato per sempre.
      ttl: 30d
      # Pulizia notturna delle entry non piu' richieste (piu' vecchie del doppio
      # del TTL): quelle ancora usate vengono rinfrescate e non ci arrivano mai.
      purge-cron: "0 30 3 * * *"
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  google:
    geocoding:
      # Chiave usata SOLO dal server: non finisce mai nel bundle del frontend.
      # Viaggia nell'header X-Goog-Api-Key, non in query string.
      api-key: ${GOOGLE_GEOCODING_API_KEY:}
      # v4: languageCode e regionCode (v3 erano language e region).
      language: it
      region: IT

logging:
  level:
    it.epicode.solution.segnalazioni: DEBUG
