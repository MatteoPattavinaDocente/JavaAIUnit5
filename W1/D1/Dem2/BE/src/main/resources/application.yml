spring:
  application:
    name: w1d1-mappe

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/W1D1Dem2_Mappe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      # entity e tabelle coincidano. Con update una entity sbagliata modificherebbe
      # il database di nascosto.
      # update: lo schema lo crea e aggiorna Hibernate dalle @Entity.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    it.epicode.demo.mappe: DEBUG
