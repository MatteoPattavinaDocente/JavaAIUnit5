spring:
  application:
    name: w1d1-mappe-geocoding

  # I segreti stanno in BE/secrets.properties, fuori dal versionamento. "optional:"
  # vuol dire che l'avvio non fallisce se il file non c'e': in quel caso la chiave
  # deve arrivare dalla variabile d'ambiente, che ha comunque la precedenza.
  config:
    import: optional:file:./secrets.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/W1D1Dem3_MappeGeocoding}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      # entity e tabelle coincidano.
      # update: lo schema lo crea e aggiorna Hibernate dalle @Entity.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Configurazione del client HTTP dichiarativo: il gruppo "geocoding" e' quello
  # registrato in GeocodingClientConfig.
  http:
    serviceclient:
      geocoding:
        base-url: ${GEOCODING_BASE_URL:https://geocode.googleapis.com}
        connect-timeout: 3s
        read-timeout: 5s

app:
  cors:
    allowed-origins: http://localhost:5173
  google:
    geocoding:
      # Chiave usata SOLO dal server: non finisce mai nel bundle del frontend.
      # Va passata come variabile d'ambiente, non scritta qui.
      api-key: ${GOOGLE_GEOCODING_API_KEY:}

logging:
  level:
    it.epicode.demo.mappe: DEBUG
