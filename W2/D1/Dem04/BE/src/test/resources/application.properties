# Il bean JavaMailSender e' sostituito da @MockitoBean, quindi questi valori
# non vengono mai usati per aprire una connessione (slide 42). Servono solo a
# far risolvere i segnaposto ${MAIL_USERNAME} e ${MAIL_PASSWORD} di
# application.yml, che in questo progetto non hanno un valore di ripiego.
# Nessuna credenziale vera nei test: la suite gira offline e in CI.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=non-usata

# Database in memoria: il PostgreSQL della demo non viene toccato.
spring.datasource.url=jdbc:h2:mem:verifica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.mail.mittente=notifiche@example.com
app.base-url=http://localhost:8080
app.token.validita-ore=24
app.cors.allowed-origin=http://localhost:5173
