# Le lettere accentate stanno qui, non nel codice Java. Il file va salvato in
# UTF-8 (spring.messages.encoding lo assume) altrimenti gli accenti si rompono.
#
# Attenzione: nei messaggi con argomenti ({0}) MessageFormat tratta la virgoletta
# semplice come carattere di escape. Qui usiamo l apostrofo tipografico, che non
# ha quel problema ed e anche la forma corretta in tipografia.

email.oggetto=Conferma il tuo indirizzo
email.titolo=Benvenuto, {0}
email.corpo=Il tuo account è stato creato. Manca solo la conferma dell’indirizzo.
email.scadenza=Il collegamento vale {0} ore: dopo scade e ne serve uno nuovo.
email.pulsante=Conferma l’indirizzo
email.piede.motivo=Ricevi questo messaggio perché ti sei iscritto a EPICODE.
email.piede.firma=EPICODE — Rome, Milan, Malta
email.testo=Benvenuto, {0}.\nIl tuo account è stato creato: conferma l’indirizzo entro {1} ore\naprendo il collegamento contenuto in questo messaggio.
