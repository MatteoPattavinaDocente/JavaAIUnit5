<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
  <meta charset="UTF-8">
  <title>Benvenuto</title>
</head>
<!--
  Il file e' HTML valido: aperto nel browser si vede cosi' com'e', con i valori
  di esempio scritti dentro i tag. Gli attributi th: vengono sostituiti solo
  quando il motore lo elabora (slide 29).

  Gli stili stanno negli ATTRIBUTI, non in un blocco <style>: molti client di
  posta scartano il foglio di stile (slide 30). L'impaginazione a tabelle, con
  larghezza fissa intorno ai 600 pixel, e' il compromesso compatibile con
  Outlook e con i telefoni.
-->
<body style="margin:0; padding:24px 0; background:#f6f7f9;
             font-family: Arial, Helvetica, sans-serif; color:#1c1f24;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
       align="center" style="width:600px; max-width:100%; background:#ffffff;
       border:1px solid #d5d8dd; border-radius:8px;">
  <tr>
    <td style="padding:24px;">

      <!-- L'immagine viaggia dentro il messaggio: cid: richiama il nome dato a
           addInline. Un percorso relativo non funzionerebbe (slide 34). -->
      <img src="cid:logo" alt="EPICODE" width="120"
           style="display:block; border:0; margin-bottom:20px;">

      <h1 th:text="#{email.titolo(${nome})}"
          style="margin:0 0 12px; font-size:22px; color:#061e37;">
        Benvenuto, Anna
      </h1>

      <p th:text="#{email.corpo}" style="margin:0 0 16px; font-size:15px; line-height:1.5;">
        Il tuo account è stato creato. Manca solo la conferma dell’indirizzo.
      </p>

      <p th:text="#{email.scadenza(${ore})}"
         style="margin:0 0 24px; font-size:15px; line-height:1.5;">
        Il collegamento vale 24 ore.
      </p>

      <!-- Il pulsante e' una tabella, non un div: i client vecchi non
           impaginano i div come ci si aspetta. -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="background:#061e37; border-radius:6px;">
            <a th:href="${collegamento}" href="https://esempio.local/conferma"
               th:text="#{email.pulsante}"
               style="display:inline-block; padding:12px 22px; color:#ffffff;
                      font-size:15px; text-decoration:none;">
              Conferma l’indirizzo
            </a>
          </td>
        </tr>
      </table>

      <!-- Il piede di pagina si scrive una volta e si include ovunque (slide 33). -->
      <div th:replace="~{email/frammenti :: piede}"></div>

    </td>
  </tr>
</table>

</body>
</html>
